<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Результат дослідження</title>
<style>
:root{--bg:#f3f6f7;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--ac:#0e7490}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.w{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.lg{width:42px;height:42px;border-radius:12px;background:var(--ac);display:grid;place-items:center;color:#fff;font-weight:800}
.top b{display:block;font-size:15px}.top span{font-size:12.5px;color:var(--mu)}
.c{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:18px;margin-bottom:12px}
h1{font-size:21px;line-height:1.25;margin:0 0 4px}.sub{color:var(--mu);font-size:13.5px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.meta div{background:var(--bg);border-radius:12px;padding:9px 11px}.meta span{display:block;font-size:11.5px;color:var(--mu)}.meta b{font-size:14px}
.img{display:block;width:100%;border-radius:14px;background:#000;cursor:zoom-in}
.cap{font-size:12px;color:var(--mu);text-align:center;margin-top:6px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:0 0 8px}
.res{font-size:16px;line-height:1.55;white-space:pre-line}.rec{margin-top:10px;padding:10px 12px;border-radius:12px;background:#ecfeff;color:#155e75;font-size:14px}
.doc{margin-top:12px;font-size:13px;color:var(--mu)}
.acts{display:flex;gap:8px;flex-wrap:wrap}.b{flex:1;min-width:140px;text-align:center;padding:12px 14px;border-radius:12px;background:var(--ac);color:#fff;text-decoration:none;font-weight:600;border:0;font:inherit;cursor:pointer}.b.g{background:#fff;color:var(--tx);border:1px solid var(--ln)}
.note{font-size:12.5px;color:var(--mu);margin-top:4px}
#zm{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:9}#zm.on{display:flex}#zm img{max-width:100%;max-height:100%}
.err{max-width:520px;margin:20vh auto;padding:0 20px;color:var(--mu);text-align:center}
@media print{.acts,#zm{display:none!important}body{background:#fff}.c{border-color:#ccc}}
</style>
</head>
<body>
<div id="app"></div>
<div id="zm" onclick="this.classList.remove('on')"><img alt=""></div>
<script type="module">
/* страница пациента по ссылке из CRM (раздел «Результати»): всё — в части после #, на сервер не уходит; без прізвища, телефону, дати народження */
import { decode, xrSvg } from './xray/img.js'
const el = document.getElementById('app'), E = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const dmy = s => String(s || '').slice(0, 10).split('-').reverse().join('.')
try {
  const d = decode(location.hash)
  if (!d || !d.s) throw new Error('нет данных')
  document.title = 'Результат: ' + d.s + (d.c ? ' · ' + d.c : '')
  const img = xrSvg(d.z, d.sd, d.p)
  el.innerHTML = `<div class="w">
    <div class="top"><div class="lg">R</div><div><b>${E(d.c)}</b><span>${E(d.a || '')}</span></div></div>
    <div class="c"><h1>${d.n ? E(d.n) + ', ваш' : 'Ваш'} результат готовий</h1><div class="sub">${E(d.s)}</div>
      <div class="meta"><div><span>Дата дослідження</span><b>${dmy(d.d)}</b></div><div><span>Опис готовий</span><b>${dmy(d.rd || d.d)}</b></div></div></div>
    <div class="c"><img class="img" id="im" src="${img}" alt="Знімок"><div class="cap">Натисніть, щоб збільшити</div></div>
    <div class="c"><h3>Висновок лікаря-рентгенолога</h3><div class="res">${E(d.r)}</div>${d.rc ? `<div class="rec">${E(d.rc)}</div>` : ''}
      <div class="doc">${E(d.doc || '')}${d.doc ? ' · ' : ''}лікар-рентгенолог</div></div>
    <div class="c"><div class="acts">${d.ph ? `<a class="b" href="tel:${E(String(d.ph).replace(/[^\d+]/g, ''))}">Подзвонити в центр</a>` : ''}<button class="b g" onclick="print()">Зберегти PDF</button></div>
      <div class="note">Покажіть цю сторінку своєму сімейному лікарю. Оригінал знімка можна отримати в центрі на диску або USB.</div></div>
  </div>`
  document.getElementById('im').onclick = () => { const z = document.getElementById('zm'); z.querySelector('img').src = img; z.classList.add('on') }
} catch (e) {
  el.innerHTML = '<div class="err">Посилання неповне. Попросіть центр надіслати його ще раз.</div>'
  console.error(e)
}
</script>

</body>
</html>
