<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Ваши зубы</title>
<style>html,body{margin:0;background:#f4f7f8}body{-webkit-text-size-adjust:100%}.pv-err{max-width:520px;margin:20vh auto;padding:0 20px;font:15px/1.5 system-ui,sans-serif;color:#475569;text-align:center}</style></head>
<body><div id="app"></div>
<script type="module">
/* страница пациента по ссылке из CRM: всё — в части после #, на сервер не уходит */
import { decode, renderPatient } from './dent3d/patient.js'
const el = document.getElementById('app')
try {
  const d = await decode(location.hash)
  if (!d) throw new Error('нет данных')
  document.title = (d.n ? d.n + ' · ' : '') + 'Ваши зубы' + (d.c ? ' · ' + d.c : '')
  await renderPatient(el, d)
} catch (e) {
  el.innerHTML = '<div class="pv-err">Ссылка неполная. Попросите клинику прислать её ещё раз.</div>'
  console.error(e)
}
</script>
</body></html>
